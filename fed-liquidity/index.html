<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>돈쌤 | 연준 유동성 대시보드</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>body{background:#0b1220;color:#e8edf6;font-family:system-ui,sans-serif;max-width:1200px;margin:auto;padding:20px}h1{font-size:25px}.sub{color:#9aa9c2}.panel{background:#151f32;border-radius:16px;padding:15px;margin:22px 0}.plot{height:410px}a{color:#8bb9ff}small{color:#9aa9c2}</style></head><body><h1>돈쌤 · 연준 유동성</h1><p class="sub" id="stamp">FRED 데이터 불러오는 중…</p><section class="panel"><h2>① 연준 자산과 순유동성</h2><div class="plot" id="a"></div></section><section class="panel"><h2>② TGA·ON RRP 평균과 52주선</h2><div class="plot" id="b"></div></section><section class="panel"><h2>③ 52주 이동평균 이격률</h2><div class="plot" id="c"></div></section><p><small>단위: 조 달러. 각 수치는 주간 수요일 기준 최근 7일 이내 관측값을 결합. 순유동성 = WALCL − TGA − ON RRP. ON RRP는 원자료 십억 달러에서 백만 달러로 변환. 서로 다른 관측일을 결합하므로 동시점 확정 잔액이 아님. QT 구간은 별도 검증 없이 임의 표시하지 않음.</small></p><script>
const base={paper_bgcolor:'#151f32',plot_bgcolor:'#151f32',font:{color:'#dce6f5'},margin:{l:55,r:15,t:15,b:55},xaxis:{gridcolor:'#28364e'},yaxis:{gridcolor:'#28364e'},legend:{orientation:'h',y:-.2},hovermode:'x unified'};
const line=(x,y,name,color)=>({x,y,name,type:'scatter',mode:'lines',line:{color,width:2},connectgaps:false});
(async()=>{const sources=['./data.json?ts='+Date.now(),'https://raw.githubusercontent.com/df3fsdfs/nasdaq100-valuation/main/fed-liquidity/data.json?ts='+Date.now()];let errors=[];for(const url of sources){try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.rows)||!d.rows.length)throw Error('Invalid rows');return d}catch(e){errors.push(url+': '+e.message)}}throw Error(errors.join(' | '))})().then(d=>{
 const rows=d.rows,x=rows.map(r=>r.date);
 document.getElementById('stamp').textContent='최종 갱신 '+d.generated_at.slice(0,16)+' UTC · 마지막 주간 데이터 '+x.at(-1)+' · 원자료 최신 관측 '+Object.entries(d.latest_observations).map(([k,v])=>k+': '+v).join(' / ');
 Plotly.newPlot('a',[line(x,rows.map(r=>r.WALCL),'연준 총자산','#62a6ff'),line(x,rows.map(r=>r.WTREGEN),'TGA','#ffb45c'),line(x,rows.map(r=>r.RRPONTSYD),'ON RRP','#d28bff'),line(x,rows.map(r=>r.WRESBAL),'지급준비금','#63d6ad'),line(x,rows.map(r=>r.net),'순유동성','#ff6f91')],{...base,yaxis:{...base.yaxis,title:'조 달러'}},{responsive:true});
 Plotly.newPlot('b',[line(x,rows.map(r=>r.pool),'(TGA+RRP)/2','#62a6ff'),line(x,rows.map(r=>r.ma52),'52주 평균','#ffb45c')],{...base,yaxis:{...base.yaxis,title:'조 달러'}},{responsive:true});
 const dev=rows.map(r=>r.deviation);const bands=[[-30,-20,'rgba(255,80,80,.14)'],[-20,20,'rgba(90,160,255,.08)'],[20,30,'rgba(255,80,80,.14)']].map(([y0,y1,fillcolor])=>({type:'rect',xref:'paper',yref:'y',x0:0,x1:1,y0,y1,fillcolor,line:{width:0},layer:'below'}));
 Plotly.newPlot('c',[line(x,dev,'이격률','#69d5bc')],{...base,shapes:[...bands,...[-30,-20,20,30].map(y=>({type:'line',xref:'paper',yref:'y',x0:0,x1:1,y0:y,y1:y,line:{color:'#6d7890',dash:'dot'}}))],yaxis:{...base.yaxis,title:'%'}},{responsive:true});
}).catch(e=>document.getElementById('stamp').textContent='데이터 로딩 실패: '+e.message);
</script></body></html>
