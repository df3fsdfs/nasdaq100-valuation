name: Donssam daily sentiment
# Scheduled refreshes are centralized in update-data.yml.
on:
  workflow_dispatch:
concurrency:
  group: donssam-daily-sentiment
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  sentiment:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas yfinance requests
      - run: python donssam/sentiment.py
      - name: Save daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donssam/sentiment.json
          git diff --cached --quiet || (git commit -m "Update Donssam daily sentiment" && (git pull --rebase -X theirs || (git rebase --abort && git pull --no-rebase -X theirs)) && git push)

