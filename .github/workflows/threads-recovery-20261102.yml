name: Recover approved November 2 Threads
on:
  push:
    branches: [main]
    paths: ['.github/workflows/threads-recovery-20261102.yml']
permissions:
  contents: write
concurrency:
  group: donssam-threads-publisher
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify recovery and duplicate protection
        run: python -m unittest discover -s donssam -p test_threads_publish.py
      - name: Publish original approved dated queue
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python donssam/threads_publish.py --date 2026-11-02
