name: Update Fed liquidity
on:
  schedule:
    - cron: '30 9 * * 4'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and calculate
        run: python fed-liquidity/update.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fed-liquidity/data.json
          git diff --cached --quiet || (git commit -m "Update Fed liquidity data" && git push)
