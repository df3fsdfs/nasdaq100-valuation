name: Update Fed liquidity and Donssam portal
on:
  schedule:
    - cron: '30 9 * * 4'
  push:
    branches: [main]
    paths:
      - 'donssam/update.py'
      - '.github/workflows/fed-liquidity.yml'
  workflow_dispatch:
concurrency:
  group: donssam-weekly-refresh
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install screen dependencies
        run: pip install yfinance pandas requests beautifulsoup4
      - name: Fetch Fed liquidity
        run: python fed-liquidity/update.py
      - name: Update market screens
        run: python donssam/update.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fed-liquidity/data.json donssam/screen.json
          git diff --cached --quiet || (git commit -m "Update Fed liquidity and Donssam screens" && git pull --rebase -X theirs && git push)
