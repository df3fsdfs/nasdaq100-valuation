name: Donssam OECD CLI
on:
  schedule:
    - cron: '0 1 1 * *'
  push:
    branches: [main]
    paths:
      - 'donssam/cli_update.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: donssam-cli
  cancel-in-progress: true
jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python donssam/cli_update.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donssam/cli.json
          git diff --cached --quiet || (git commit -m "Update OECD CLI" && git pull --rebase -X theirs && git push)
