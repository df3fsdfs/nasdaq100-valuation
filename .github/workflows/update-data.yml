name: NASDAQ-40 Build and Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: nasdaq40-pages
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        if: github.event.schedule == '30 23 * * 1-5'
        with:
          python-version: '3.11'
      - name: Install valuation dependencies
        if: github.event.schedule == '30 23 * * 1-5'
        run: pip install requests yfinance
      - name: Update NASDAQ-40 valuation
        if: github.event.schedule == '30 23 * * 1-5'
        env:
          BUSINESSQUANT_API_KEY: ${{ secrets.BUSINESSQUANT_API_KEY }}
        run: python fetch_data.py
      - name: Preserve valuation observations
        if: github.event.schedule == '30 23 * * 1-5'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json history_cache.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh NASDAQ-40 valuation'
            git pull --rebase origin main
            git push
          fi
      - name: Prepare public assets only
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          files = ['.nojekyll','index.html','data.json','fed-liquidity/index.html','fed-liquidity/data.json','donssam/index.html','donssam/public.js','donssam/institutional_positions.js','donssam/live_quotes.js','donssam/news.json','donssam/quotes.json','donssam/sentiment.html','donssam/public_dashboard.json','donssam/institutional_positions_public.json']
          files += [str(p) for p in Path('donssam/news').glob('*.json')]
          out=Path('_public')
          out.mkdir(exist_ok=True)
          for name in files:
              src=Path(name)
              if not src.is_file(): raise SystemExit('Missing public asset: '+name)
              dst=out/name
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(src,dst)
          forbidden={'bottom.json','screen.json','insights.json','sentiment.json','institutional_positions.json','cli.json','degrossing_observations.json'}
          assert not any(p.suffix=='.py' or p.name in forbidden for p in out.rglob('*') if p.is_file())
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: nasdaq40-pages
          path: _public
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: nasdaq40-pages
