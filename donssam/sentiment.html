<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>돈쌤 심리지수</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>body{background:#0a1020;color:#e8edf8;font:15px system-ui;margin:0}main{max-width:1100px;margin:auto;padding:20px}a{color:#9ec4ff}section{background:#141e31;border:1px solid #293950;border-radius:16px;padding:18px;margin:18px 0}h1{font-size:26px}.muted{color:#a7b4cb}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.score{font-size:48px;font-weight:800}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:530px}td,th{padding:10px;border-bottom:1px solid #293950;text-align:right}td:first-child,th:first-child{text-align:left}</style></head><body><main><p><a href="./">← 돈쌤 포털</a></p><h1>돈쌤 시장 심리지수</h1><p class="muted">0 극단적 공포 · 50 중립 · 100 극단적 탐욕. 낙폭 비중을 높인 연구용 지수</p><div class="cards"><section><h2>미국 증시</h2><div class="score" id="equityscore">—</div><div id="equitycoverage" class="muted"></div></section><section><h2>크립토</h2><div class="score" id="cryptoscore">—</div><div id="cryptocoverage" class="muted"></div></section></div><section><h2>일별 점수 변화</h2><div id="chart" style="height:340px"></div></section><section><h2>증시 세부 점수</h2><div class="scroll"><table><thead><tr><th>항목</th><th>실측값</th><th>배점</th><th>기여점수</th><th>관측일</th></tr></thead><tbody id="equityparts"></tbody></table></div></section><section><h2>크립토 세부 점수</h2><div class="scroll"><table><thead><tr><th>항목</th><th>실측값</th><th>배점</th><th>기여점수</th><th>관측일</th></tr></thead><tbody id="cryptoparts"></tbody></table></div></section><p id="status" class="muted">데이터 불러오는 중…</p></main><script>
fetch('./sentiment.json?v='+Date.now()).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{const x=d.latest;const color=n=>n==null?'#aaa':n<=20?'#e57373':n<=40?'#edaa70':n<=60?'#d9c66a':n<=80?'#91c995':'#5ad5ad';for(const key of ['equity','crypto']){const v=x[key];const el=document.getElementById(key+'score');el.textContent=v.score==null?'—':v.score.toFixed(1);el.style.color=color(v.score);document.getElementById(key+'coverage').textContent='데이터 충족률 '+v.coverage+'%';document.getElementById(key+'parts').innerHTML=v.components.map(p=>'<tr><td>'+p.name+'</td><td>'+(p.value==null?'없음':p.value+' '+p.unit)+'</td><td>'+p.weight+'</td><td>'+(p.points==null?'—':p.points)+'</td><td>'+(p.date||'—')+'</td></tr>').join('')}const h=d.history||[];Plotly.newPlot('chart',[{x:h.map(v=>v.date),y:h.map(v=>v.equity.score),name:'증시',mode:'lines+markers',line:{color:'#6ea8ff'}},{x:h.map(v=>v.date),y:h.map(v=>v.crypto.score),name:'크립토',mode:'lines+markers',line:{color:'#f0af6b'}}],{paper_bgcolor:'#141e31',plot_bgcolor:'#141e31',font:{color:'#e8edf8'},margin:{l:40,r:10,t:10,b:45},yaxis:{range:[0,100]},legend:{orientation:'h',y:-.2}},{responsive:true});document.getElementById('status').textContent='기준일 '+x.date+' · 일별 기록 '+h.length+'건. '+x.method+' '+x.source_notes}).catch(e=>document.getElementById('status').textContent='데이터 로딩 실패: '+e.message);
</script></body></html>
