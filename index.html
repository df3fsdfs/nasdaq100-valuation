<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NASDAQ-40 Valuation</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f7fa;
  color: #111827;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

header {
  background: #111827;
  color: white;
  padding: 22px 18px;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

.subtitle {
  margin-top: 6px;
  color: #9ca3af;
  font-size: 13px;
}

.container {
  max-width: 1250px;
  margin: auto;
  padding: 18px;
}

.cards {
  display: grid;
  grid-template-columns:
    repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 15px;
  box-shadow:
    0 2px 8px rgba(0,0,0,0.06);
}

.label {
  color: #6b7280;
  font-size: 12px;
}

.value {
  margin-top: 5px;
  font-size: 22px;
  font-weight: 700;
}

.live {
  color: #059669;
}

.controls {
  background: white;
  border-radius: 14px;
  padding: 13px;
  margin-bottom: 14px;

  display: grid;
  grid-template-columns:
    2fr 1fr;
  gap: 10px;
}

input,
select {
  width: 100%;
  padding: 11px;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  background: white;
  font-size: 14px;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
  border-radius: 14px;
}

table {
  width: 100%;
  min-width: 1050px;
  border-collapse: collapse;
  background: white;
}

th,
td {
  padding: 10px 9px;
  border-bottom:
    1px solid #edf0f3;
  font-size: 13px;
  text-align: right;
  white-space: nowrap;
}

th {
  background: #f3f4f6;
  font-weight: 700;
}

th:first-child,
td:first-child {
  text-align: left;
}

tbody tr {
  cursor: pointer;
}

tbody tr:hover {
  background: #f8fafc;
}

.ticker {
  font-weight: 700;
}

.company {
  margin-top: 2px;
  color: #6b7280;
  font-size: 11px;
}

.na {
  color: #9ca3af;
}

.positive {
  color: #059669;
}

.negative {
  color: #dc2626;
}

.detail {
  display: none;
  margin-top: 18px;
  background: white;
  border-radius: 14px;
  padding: 18px;
  box-shadow:
    0 2px 8px rgba(0,0,0,0.06);
}

.detail h2 {
  margin: 15px 0 4px;
}

.detail h3 {
  margin-top: 24px;
}

.back {
  border: 0;
  background: #111827;
  color: white;
  padding: 9px 13px;
  border-radius: 8px;
  cursor: pointer;
}

.detail-grid {
  display: grid;
  grid-template-columns:
    repeat(5, 1fr);
  gap: 10px;
}

.metric {
  background: #f8fafc;
  border-radius: 10px;
  padding: 12px;
}

.metric-label {
  color: #6b7280;
  font-size: 12px;
}

.metric-value {
  margin-top: 5px;
  font-size: 18px;
  font-weight: 700;
}

.metric-sub {
  margin-top: 5px;
  color: #6b7280;
  font-size: 11px;
}

.note {
  margin-top: 18px;
  color: #6b7280;
  font-size: 12px;
  line-height: 1.7;
}

@media (max-width: 700px) {

  .container {
    padding: 12px;
  }

  .cards {
    grid-template-columns: 1fr;
  }

  .controls {
    grid-template-columns: 1fr;
  }

  .detail-grid {
    grid-template-columns:
      repeat(2, 1fr);
  }

}

</style>

</head>


<body>


<header>

  <h1>
    NASDAQ-40 Valuation
  </h1>

  <div class="subtitle">
    시총 상위 40개 · Forward EPS · 성장률 · FPER
  </div>

</header>


<div class="container">


  <!-- 상단 정보 -->

  <div class="cards">


    <div class="card">

      <div class="label">
        분석 종목
      </div>

      <div
        class="value"
        id="count"
      >
        -
      </div>

    </div>


    <div class="card">

      <div class="label">
        데이터 기준
      </div>

      <div
        class="value"
        id="asof"
      >
        -
      </div>

    </div>


    <div class="card">

      <div class="label">
        데이터 상태
      </div>

      <div
        class="value"
        id="status"
      >
        LOADING
      </div>

    </div>


  </div>


  <!-- 검색 / 정렬 -->

  <div class="controls">

    <input
      id="search"
      type="text"
      placeholder="종목 검색"
    >

    <select id="sort">

      <option value="rank">
        시가총액 순
      </option>

      <option value="fper">
        현재 FPER 낮은 순
      </option>

      <option value="growth">
        현재년도 EPS 성장률 높은 순
      </option>

      <option value="cagr">
        4Y EPS CAGR 높은 순
      </option>

      <option value="future">
        +4Y FPER 낮은 순
      </option>

    </select>

  </div>


  <!-- 메인 테이블 -->

  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>종목</th>

          <th>현재 FPER</th>

          <th>이전 실제 EPS</th>

          <th>현재 EPS</th>

          <th>현재 성장</th>

          <th>+1Y EPS</th>

          <th>+2Y EPS</th>

          <th>+3Y EPS</th>

          <th>+4Y EPS</th>

          <th>4Y CAGR</th>

        </tr>

      </thead>


      <tbody id="stocks">

      </tbody>

    </table>

  </div>


  <!-- 상세 -->

  <div
    id="detail"
    class="detail"
  >

  </div>


</div>


<script>


let stocks = [];

let currentYear = 2026;


/* ============================================================
   숫자 표시
============================================================ */

function number(value) {

  if (
    value === null ||
    value === undefined ||
    !Number.isFinite(Number(value))
  ) {

    return '<span class="na">N/A</span>';

  }

  return Number(value).toFixed(2);

}


function percent(value) {

  if (
    value === null ||
    value === undefined ||
    !Number.isFinite(Number(value))
  ) {

    return '<span class="na">N/A</span>';

  }

  const n = Number(value);

  const cls =
    n >= 0
      ? "positive"
      : "negative";

  return `
    <span class="${cls}">
      ${n.toFixed(1)}%
    </span>
  `;

}


function multiple(value) {

  if (
    value === null ||
    value === undefined ||
    !Number.isFinite(Number(value))
  ) {

    return '<span class="na">N/A</span>';

  }

  return (
    Number(value).toFixed(1)
    + "x"
  );

}


/* ============================================================
   날짜
============================================================ */

function formatDate(value) {

  if (!value) {
    return "-";
  }

  /*
    generated_date_kst가 있으면 그것을 사용.
    없으면 ISO timestamp에서 날짜만 추출.
  */

  if (
    typeof value === "string" &&
    value.length >= 10
  ) {

    return value.slice(0, 10);

  }

  return value;

}


/* ============================================================
   정렬
============================================================ */

function sortStocks(list) {

  const sort =
    document.getElementById(
      "sort"
    ).value;


  const copy = [...list];


  if (sort === "rank") {

    copy.sort(
      (a, b) =>
        (a.rank ?? 9999)
        -
        (b.rank ?? 9999)
    );

  }


  if (sort === "fper") {

    copy.sort(
      (a, b) => {

        const av =
          a.current_fper == null
            ? Infinity
            : Number(a.current_fper);

        const bv =
          b.current_fper == null
            ? Infinity
            : Number(b.current_fper);

        return av - bv;

      }
    );

  }


  if (sort === "growth") {

    copy.sort(
      (a, b) => {

        const av =
          a.current_growth == null
            ? -Infinity
            : Number(a.current_growth);

        const bv =
          b.current_growth == null
            ? -Infinity
            : Number(b.current_growth);

        return bv - av;

      }
    );

  }


  if (sort === "cagr") {

    copy.sort(
      (a, b) => {

        const av =
          a.cagr_4y == null
            ? -Infinity
            : Number(a.cagr_4y);

        const bv =
          b.cagr_4y == null
            ? -Infinity
            : Number(b.cagr_4y);

        return bv - av;

      }
    );

  }


  if (sort === "future") {

    copy.sort(
      (a, b) => {

        const av =
          a.future_fper?.[
            String(currentYear + 4)
          ] == null
            ? Infinity
            : Number(
                a.future_fper[
                  String(currentYear + 4)
                ]
              );

        const bv =
          b.future_fper?.[
            String(currentYear + 4)
          ] == null
            ? Infinity
            : Number(
                b.future_fper[
                  String(currentYear + 4)
                ]
              );

        return av - bv;

      }
    );

  }


  return copy;

}


/* ============================================================
   테이블
============================================================ */

function render() {

  const query =
    document.getElementById(
      "search"
    ).value
      .trim()
      .toUpperCase();


  const filtered =
    stocks.filter(stock => {

      const ticker =
        String(
          stock.ticker || ""
        ).toUpperCase();

      const company =
        String(
          stock.company || ""
        ).toUpperCase();

      return (
        ticker.includes(query)
        ||
        company.includes(query)
      );

    });


  const sorted =
    sortStocks(filtered);


  document.getElementById(
    "count"
  ).textContent =
    sorted.length;


  const tbody =
    document.getElementById(
      "stocks"
    );


  tbody.innerHTML =
    sorted.map(stock => `

      <tr
        onclick="
          showDetail('${stock.ticker}')
        "
      >

        <td>

          <div class="ticker">
            ${stock.ticker || ""}
          </div>

          <div class="company">
            ${stock.company || ""}
          </div>

        </td>


        <td>
          ${multiple(
            stock.current_fper
          )}
        </td>


        <td>
          ${number(
            stock.previous_eps
          )}
        </td>


        <td>
          ${number(
            stock.current_eps
          )}
        </td>


        <td>
          ${percent(
            stock.current_growth
          )}
        </td>


        <td>
          ${number(
            stock.y1_eps
          )}
        </td>


        <td>
          ${number(
            stock.y2_eps
          )}
        </td>


        <td>
          ${number(
            stock.y3_eps
          )}
        </td>


        <td>
          ${number(
            stock.y4_eps
          )}
        </td>


        <td>
          ${percent(
            stock.cagr_4y
          )}
        </td>


      </tr>

    `).join("");

}


/* ============================================================
   상세
============================================================ */

function showDetail(ticker) {

  const stock =
    stocks.find(
      x => x.ticker === ticker
    );


  if (!stock) {
    return;
  }


  const detail =
    document.getElementById(
      "detail"
    );


  detail.style.display =
    "block";


  const years = [
    currentYear,
    currentYear + 1,
    currentYear + 2,
    currentYear + 3,
    currentYear + 4
  ];


  detail.innerHTML = `

    <button
      class="back"
      onclick="
        document.getElementById(
          'detail'
        ).style.display='none'
      "
    >
      ← 목록
    </button>


    <h2>
      ${stock.ticker}
      ·
      ${stock.company || ""}
    </h2>


    <div class="detail-grid">


      <div class="metric">

        <div class="metric-label">
          현재 FPER
        </div>

        <div class="metric-value">
          ${multiple(
            stock.current_fper
          )}
        </div>

      </div>


      <div class="metric">

        <div class="metric-label">
          현재년도 EPS 성장
        </div>

        <div class="metric-value">
          ${percent(
            stock.current_growth
          )}
        </div>

      </div>


      <div class="metric">

        <div class="metric-label">
          4Y EPS CAGR
        </div>

        <div class="metric-value">
          ${percent(
            stock.cagr_4y
          )}
        </div>

      </div>


      <div class="metric">

        <div class="metric-label">
          성장 추세
        </div>

        <div class="metric-value">
          ${
            stock.growth_trend
              || "N/A"
          }
        </div>

      </div>


      <div class="metric">

        <div class="metric-label">
          현재 주가
        </div>

        <div class="metric-value">
          ${
            stock.price == null
              ? "N/A"
              : "$" +
                Number(
                  stock.price
                ).toFixed(2)
          }
        </div>

      </div>


    </div>


    <h3>
      EPS trajectory
    </h3>


    <div class="detail-grid">

      ${
        years.map(
          year => {

            const eps =
              stock.eps_years?.[
                String(year)
              ];


            const growth =
              stock.eps_growth?.[
                String(year)
              ];


            return `

              <div class="metric">

                <div class="metric-label">
                  ${year}
                </div>

                <div class="metric-value">
                  ${number(eps)}
                </div>

                <div class="metric-sub">
                  성장률:
                  ${percent(growth)}
                </div>

              </div>

            `;

          }
        ).join("")
      }

    </div>


    <h3>
      현재가 유지 시 FPER
    </h3>


    <div class="detail-grid">

      ${
        years.map(
          year => {

            const fper =
              stock.future_fper?.[
                String(year)
              ];


            return `

              <div class="metric">

                <div class="metric-label">
                  ${year}
                </div>

                <div class="metric-value">
                  ${multiple(fper)}
                </div>

              </div>

            `;

          }
        ).join("")
      }

    </div>


    <div class="note">

      ※ 현재 FPER = 현재 주가 ÷ 현재년도 EPS

      <br>

      ※ 현재년도 EPS 성장률 = 현재년도 예상 EPS ÷ 가장 최근 실제 EPS - 1

      <br>

      ※ 미래 FPER = 현재 주가가 그대로라고 가정하고 미래 EPS를 적용한 값

      <br>

      ※ 미래 EPS가 제공되지 않는 연도는 N/A

      <br>

      ※ 미래 EPS는 임의로 외삽하지 않음

    </div>

  `;


  detail.scrollIntoView({
    behavior: "smooth"
  });

}


/* ============================================================
   데이터 로딩
============================================================ */

async function loadData() {

  try {

    const response =
      await fetch(
        "data.json?ts="
        +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP "
        +
        response.status
      );

    }


    const data =
      await response.json();


    stocks =
      Array.isArray(
        data.stocks
      )
        ? data.stocks
        : [];


    currentYear =
      Number(
        data.current_year
      )
      ||
      new Date().getUTCFullYear();


    document.getElementById(
      "count"
    ).textContent =
      stocks.length;


    document.getElementById(
      "asof"
    ).textContent =
      formatDate(
        data.generated_date_kst
        ||
        data.generated_at
      );


    const status =
      document.getElementById(
        "status"
      );


    status.textContent =
      "LIVE";


    status.classList.add(
      "live"
    );


    render();

  }


  catch (error) {

    console.error(error);


    document.getElementById(
      "status"
    ).textContent =
      "ERROR";


    document.getElementById(
      "stocks"
    ).innerHTML = `

      <tr>

        <td
          colspan="10"
          style="
            text-align:center;
            padding:30px;
          "
        >

          데이터를 불러오지 못했습니다.

        </td>

      </tr>

    `;

  }

}


/* ============================================================
   이벤트
============================================================ */

document
  .getElementById("search")
  .addEventListener(
    "input",
    render
  );


document
  .getElementById("sort")
  .addEventListener(
    "change",
    render
  );


/* ============================================================
   시작
============================================================ */

loadData();

</script>


</body>

</html>
