<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NASDAQ-40 Valuation</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f7fa;
  color: #111827;
  font-family: Arial, sans-serif;
}

header {
  background: #111827;
  color: white;
  padding: 22px 18px;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

.sub {
  margin-top: 6px;
  color: #9ca3af;
  font-size: 13px;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 18px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 2px 8px #00000010;
}

.label {
  font-size: 12px;
  color: #6b7280;
}

.value {
  font-size: 24px;
  font-weight: 700;
  margin-top: 6px;
}

.live {
  color: #059669;
}

.controls {
  background: white;
  padding: 14px;
  border-radius: 14px;
  margin-bottom: 14px;

  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 10px;
}

input,
select {
  width: 100%;
  padding: 11px;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  background: white;
}

.table-wrap {
  overflow-x: auto;
  border-radius: 14px;
}

table {
  width: 100%;
  min-width: 950px;
  border-collapse: collapse;
  background: white;
  overflow: hidden;
}

th,
td {
  padding: 11px 9px;
  border-bottom: 1px solid #eee;
  text-align: right;
  font-size: 13px;
  white-space: nowrap;
}

th:first-child,
td:first-child {
  text-align: left;
}

th {
  background: #f3f4f6;
  font-weight: 700;
}

tbody tr {
  cursor: pointer;
}

tbody tr:hover {
  background: #f9fafb;
}

.company {
  color: #6b7280;
  font-size: 12px;
}

.na {
  color: #9ca3af;
}

.detail {
  display: none;
  background: white;
  margin-top: 18px;
  padding: 18px;
  border-radius: 14px;
  box-shadow: 0 2px 8px #00000010;
}

.detail h2 {
  margin-top: 14px;
}

.detail-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.metric {
  background: #f8fafc;
  padding: 12px;
  border-radius: 10px;
}

.metric-label {
  color: #6b7280;
  font-size: 12px;
}

.metric-value {
  font-size: 18px;
  font-weight: 700;
  margin-top: 5px;
}

.back {
  border: 0;
  background: #111827;
  color: white;
  padding: 9px 14px;
  border-radius: 8px;
  cursor: pointer;
}

.note {
  color: #6b7280;
  font-size: 12px;
  line-height: 1.6;
  margin-top: 16px;
}

@media (max-width: 700px) {

  .cards {
    grid-template-columns: 1fr;
  }

  .controls {
    grid-template-columns: 1fr;
  }

  .detail-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .container {
    padding: 12px;
  }
}
</style>
</head>

<body>

<header>
  <h1>NASDAQ-40 Valuation</h1>
  <div class="sub">
    시가총액 상위 40개 · Forward EPS · 성장률 · FPER
  </div>
</header>

<div class="container">

  <!-- 상단 정보 -->
  <div class="cards">

    <div class="card">
      <div class="label">분석 종목</div>
      <div class="value" id="count">-</div>
    </div>

    <div class="card">
      <div class="label">데이터 기준</div>
      <div class="value" id="asof">-</div>
    </div>

    <div class="card">
      <div class="label">데이터 상태</div>
      <div class="value" id="status">
        LOADING
      </div>
    </div>

  </div>


  <!-- 검색 / 정렬 -->
  <div class="controls">

    <input
      id="search"
      type="text"
      placeholder="종목 검색 (예: NVDA)"
    >

    <select id="sort">

      <option value="rank">
        시가총액 순
      </option>

      <option value="fper">
        현재 FPER 낮은 순
      </option>

      <option value="growth">
        현재년도 EPS 성장률 높은 순
      </option>

      <option value="cagr">
        4Y EPS CAGR 높은 순
      </option>

      <option value="future">
        현재가 유지 시 +4Y FPER 낮은 순
      </option>

    </select>

  </div>


  <!-- 종목 테이블 -->
  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>종목</th>

          <th>현재 FPER</th>

          <th>현재 EPS</th>

          <th>+1Y EPS</th>

          <th>+1Y 성장</th>

          <th>+2Y EPS</th>

          <th>+3Y EPS</th>

          <th>+4Y EPS</th>

          <th>4Y CAGR</th>

        </tr>

      </thead>

      <tbody id="stocks"></tbody>

    </table>

  </div>


  <!-- 상세 -->
  <div id="detail" class="detail"></div>

</div>


<script>

let stocks = [];


/* -----------------------------
   공통 함수
----------------------------- */

function $(id) {
  return document.getElementById(id);
}


function formatNumber(value, decimals = 2) {

  if (
    value === null ||
    value === undefined ||
    value === "" ||
    Number.isNaN(Number(value))
  ) {
    return '<span class="na">N/A</span>';
  }

  return Number(value).toFixed(decimals);
}


function formatPercent(value) {

  if (
    value === null ||
    value === undefined ||
    value === "" ||
    Number.isNaN(Number(value))
  ) {
    return '<span class="na">N/A</span>';
  }

  return (Number(value) * 100).toFixed(1) + "%";
}


/*
현재가가 미래에도 그대로라고 가정했을 때의 FPER

현재 FPER × 현재 EPS / 미래 EPS
*/
function futureFper(stock, index) {

  const currentFper = Number(stock.current_fper);
  const currentEPS = Number(stock.eps_current);

  const futureEPS =
    stock.eps &&
    stock.eps[index] !== undefined
      ? Number(stock.eps[index])
      : null;


  if (
    !Number.isFinite(currentFper) ||
    !Number.isFinite(currentEPS) ||
    currentFper <= 0 ||
    currentEPS <= 0 ||
    !Number.isFinite(futureEPS) ||
    futureEPS <= 0
  ) {
    return null;
  }


  return currentFper * currentEPS / futureEPS;
}


function formatFutureFper(stock, index) {

  const value = futureFper(stock, index);

  if (value === null) {
    return '<span class="na">N/A</span>';
  }

  return value.toFixed(1) + "x";
}


/* -----------------------------
   테이블 렌더링
----------------------------- */

function render() {

  const query =
    $("search").value
      .trim()
      .toUpperCase();


  let filtered =
    stocks.filter(stock => {

      const ticker =
        String(stock.ticker || "")
          .toUpperCase();

      const company =
        String(stock.company || "")
          .toUpperCase();

      return (
        ticker.includes(query) ||
        company.includes(query)
      );

    });


  const sortType =
    $("sort").value;


  /* 시가총액 순 */

  if (sortType === "rank") {

    filtered.sort((a, b) => {

      const ar =
        a.rank === undefined
          ? 9999
          : Number(a.rank);

      const br =
        b.rank === undefined
          ? 9999
          : Number(b.rank);

      return ar - br;

    });

  }


  /* 현재 FPER */

  if (sortType === "fper") {

    filtered.sort((a, b) => {

      const av =
        a.current_fper == null
          ? Infinity
          : Number(a.current_fper);

      const bv =
        b.current_fper == null
          ? Infinity
          : Number(b.current_fper);

      return av - bv;

    });

  }


  /* 현재년도 EPS 성장률 */

  if (sortType === "growth") {

    filtered.sort((a, b) => {

      const av =
        a.growth_current == null
          ? -Infinity
          : Number(a.growth_current);

      const bv =
        b.growth_current == null
          ? -Infinity
          : Number(b.growth_current);

      return bv - av;

    });

  }


  /* 4Y CAGR */

  if (sortType === "cagr") {

    filtered.sort((a, b) => {

      const av =
        a.cagr_4y == null
          ? -Infinity
          : Number(a.cagr_4y);

      const bv =
        b.cagr_4y == null
          ? -Infinity
          : Number(b.cagr_4y);

      return bv - av;

    });

  }


  /* 현재가 유지 +4Y FPER */

  if (sortType === "future") {

    filtered.sort((a, b) => {

      const av =
        futureFper(a, 4) === null
          ? Infinity
          : futureFper(a, 4);

      const bv =
        futureFper(b, 4) === null
          ? Infinity
          : futureFper(b, 4);

      return av - bv;

    });

  }


  $("count").textContent =
    filtered.length;


  $("stocks").innerHTML =
    filtered.map(stock => {

      return `

        <tr onclick="showDetail('${stock.ticker}')">

          <td>

            <b>
              ${stock.ticker || ""}
            </b>

            <br>

            <span class="company">
              ${stock.company || ""}
            </span>

          </td>


          <td>
            ${
              stock.current_fper == null
                ? '<span class="na">N/A</span>'
                : Number(stock.current_fper).toFixed(1) + "x"
            }
          </td>


          <td>
            ${formatNumber(stock.eps_current)}
          </td>


          <td>
            ${
              stock.eps &&
              stock.eps[1] !== undefined
                ? formatNumber(stock.eps[1])
                : '<span class="na">N/A</span>'
            }
          </td>


          <td>
            ${formatPercent(stock.growth_current)}
          </td>


          <td>
            ${
              stock.eps &&
              stock.eps[2] !== undefined
                ? formatNumber(stock.eps[2])
                : '<span class="na">N/A</span>'
            }
          </td>


          <td>
            ${
              stock.eps &&
              stock.eps[3] !== undefined
                ? formatNumber(stock.eps[3])
                : '<span class="na">N/A</span>'
            }
          </td>


          <td>
            ${
              stock.eps &&
              stock.eps[4] !== undefined
                ? formatNumber(stock.eps[4])
                : '<span class="na">N/A</span>'
            }
          </td>


          <td>
            ${formatPercent(stock.cagr_4y)}
          </td>

        </tr>

      `;

    }).join("");

}


/* -----------------------------
   종목 상세
----------------------------- */

function showDetail(ticker) {

  const stock =
    stocks.find(
      item => item.ticker === ticker
    );


  if (!stock) {
    return;
  }


  const detail =
    $("detail");


  detail.style.display =
    "block";


  detail.innerHTML = `

    <button
      class="back"
      onclick="this.parentElement.style.display='none'"
    >
      ← 목록
    </button>


    <h2>
      ${stock.ticker}
      ·
      ${stock.company || ""}
    </h2>


    <div class="detail-grid">


      <div class="metric">

        <div class="metric-label">
          현재 FPER
        </div>

        <div class="metric-value">

          ${
            stock.current_fper == null
              ? "N/A"
              : Number(stock.current_fper).toFixed(1) + "x"
          }

        </div>

      </div>


      <div class="metric">

        <div class="metric-label">
          현재년도 EPS 성장
        </div>

        <div class="metric-value">
          ${formatPercent(stock.growth_current)}
        </div>

      </div>


      <div class="metric">

        <div class="metric-label">
          4Y EPS CAGR
        </div>

        <div class="metric-value">
          ${formatPercent(stock.cagr_4y)}
        </div>

      </div>


      <div class="metric">

        <div class="metric-label">
          성장 추세
        </div>

        <div class="metric-value">

          ${
            stock.growth_trend || "N/A"
          }

        </div>

      </div>

    </div>


    <h3>
      EPS trajectory
    </h3>


    <div class="detail-grid">


      ${renderEPSMetric(
        "현재",
        stock.eps_current,
        futureFper(stock, 0)
      )}


      ${renderEPSMetric(
        "+1Y",
        stock.eps?.[1],
        futureFper(stock, 1)
      )}


      ${renderEPSMetric(
        "+2Y",
        stock.eps?.[2],
        futureFper(stock, 2)
      )}


      ${renderEPSMetric(
        "+3Y",
        stock.eps?.[3],
        futureFper(stock, 3)
      )}


      ${renderEPSMetric(
        "+4Y",
        stock.eps?.[4],
        futureFper(stock, 4)
      )}

    </div>


    <h3>
      현재가 유지 시 FPER
    </h3>


    <div class="detail-grid">


      ${renderFutureFper(
        "현재",
        futureFper(stock, 0)
      )}


      ${renderFutureFper(
        "+1Y",
        futureFper(stock, 1)
      )}


      ${renderFutureFper(
        "+2Y",
        futureFper(stock, 2)
      )}


      ${renderFutureFper(
        "+3Y",
        futureFper(stock, 3)
      )}


      ${renderFutureFper(
        "+4Y",
        futureFper(stock, 4)
      )}

    </div>


    <div class="note">

      ※ 미래 EPS가 제공되지 않는 연도는 N/A로 표시합니다.
      <br>
      ※ 현재가 유지 시 FPER은 현재 주가가 미래에도 그대로라고 가정하고 EPS 변화만 반영한 값입니다.
      <br>
      ※ 미래 EPS를 임의로 추정하거나 외삽하지 않습니다.

    </div>

  `;


  detail.scrollIntoView({
    behavior: "smooth"
  });

}


function renderEPSMetric(
  label,
  eps,
  fper
) {

  return `

    <div class="metric">

      <div class="metric-label">
        ${label} EPS
      </div>

      <div class="metric-value">
        ${formatNumber(eps)}
      </div>

      <div class="small">
        현재가 유지 FPER:
        ${
          fper === null
            ? "N/A"
            : fper.toFixed(1) + "x"
        }
      </div>

    </div>

  `;

}


function renderFutureFper(
  label,
  value
) {

  return `

    <div class="metric">

      <div class="metric-label">
        ${label}
      </div>

      <div class="metric-value">

        ${
          value === null
            ? "N/A"
            : value.toFixed(1) + "x"
        }

      </div>

    </div>

  `;

}


/* -----------------------------
   data.json 로딩
----------------------------- */

async function loadData() {

  try {

    const response =
      await fetch(
        "data.json?ts=" + Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "data.json HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    /*
      data.json 구조가

      {
        stocks: [...]
      }

      또는

      [...]
      
      둘 다 대응
    */

    if (Array.isArray(data)) {

      stocks = data;

    } else {

      stocks =
        Array.isArray(data.stocks)
          ? data.stocks
          : [];

    }


    $("count").textContent =
      stocks.length;


    $("asof").textContent =
      data.as_of ||
      data.updated_at ||
      data.generated_at ||
      "-";


    $("status").textContent =
      "LIVE";

    $("status").classList.add(
      "live"
    );


    render();


  } catch (error) {

    console.error(
      "data.json 로딩 실패:",
      error
    );


    $("status").textContent =
      "ERROR";


    $("count").textContent =
      "0";


    $("stocks").innerHTML = `

      <tr>

        <td colspan="9"
            style="text-align:center;padding:30px">

          data.json을 불러오지 못했습니다.

        </td>

      </tr>

    `;

  }

}


/* -----------------------------
   이벤트
----------------------------- */

$("search")
  .addEventListener(
    "input",
    render
  );


$("sort")
  .addEventListener(
    "change",
    render
  );


/* -----------------------------
   시작
----------------------------- */

loadData();

</script>

</body>
</html>
